name: atlas
description: Sistema de navegação e produção para embarcações pesqueiras
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  http: ^1.2.2
  flutter:
    sdk: flutter

  # SQLite puro
  sqflite: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # PDF Viewer
  pdfrx: ^1.0.0

  # Geolocalização
  geolocator: ^13.0.0
  workmanager: 0.9.0+3
  permission_handler: ^12.0.0


  # Mapa offline (MBTiles + GeoTIFF)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  file_picker: ^8.1.6
  image: ^4.5.0

  # Armazenamento local NoSQL
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.0
  device_info_plus: ^12.4.0
  android_id: ^0.5.2+1
  battery_plus: ^6.2.1
  flutter_native_splash: ^2.4.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#000000"
  fullscreen: true
  android_12:
    color: "#000000"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/blue_ocean.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/cartas/
    - assets/icons/
    - assets/json/
    - assets/json/posicoes/
   