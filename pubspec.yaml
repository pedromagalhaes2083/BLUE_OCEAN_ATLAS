name: atlas
description: Sistema de navegação e produção para embarcações pesqueiras
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite puro
  sqflite: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # PDF Viewer
  pdfrx: ^1.0.0

  # Geolocalização
  geolocator: ^13.0.0
  workmanager: 0.9.0+3
  permission_handler: ^12.0.0


  # Utils
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/cartas/
    - assets/icons/
    - assets/json/
   